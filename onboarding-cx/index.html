<!doctype html>
<html
  lang="pt-BR"
  data-composition-variables='[
    {"id":"ground","type":"color","label":"Fundo","default":"#F5F7FB"},
    {"id":"ink","type":"color","label":"Texto","default":"#0F1B33"},
    {"id":"accent","type":"color","label":"Destaque","default":"#4F46E5"},
    {"id":"accent2","type":"color","label":"Destaque 2","default":"#14B8A6"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <style>
      :root {
        --ground: #f5f7fb;
        --ink: #0f1b33;
        --accent: #4f46e5;
        --accent2: #14b8a6;
        --font-display: "Poppins", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root { position: relative; width: 1920px; height: 1080px; font-family: var(--font-display); }
      #bg { position: absolute; inset: 0; background: var(--ground); }
      .blob { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.35; }
      #blob-a { width: 760px; height: 760px; left: -180px; top: -240px; background: var(--accent); }
      #blob-b { width: 680px; height: 680px; right: -160px; bottom: -260px; background: var(--accent2); }
      .scene-host { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-kbh8" id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1920" data-height="1080">
      <div data-hf-id="hf-5qeh" id="bg" data-layout-ignore>
        <div data-hf-id="hf-nrpc" id="blob-a" class="blob"></div>
        <div data-hf-id="hf-yn6z" id="blob-b" class="blob"></div>
      </div>

      <div data-hf-id="hf-9gzv" id="intro" class="scene-host" data-composition-id="intro" data-composition-src="compositions/intro.html"
        data-start="0" data-duration="3.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>

      <div data-hf-id="hf-tt1t" id="topics" class="scene-host" data-composition-id="topics" data-composition-src="compositions/topics.html"
        data-start="3.5" data-duration="7.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>

      <div data-hf-id="hf-01jg" id="legenda" class="scene-host" data-composition-id="legenda" data-composition-src="compositions/legenda.html"
        data-start="3.5" data-duration="7.5" data-track-index="2" data-track-kind="captions" data-width="1920" data-height="1080"></div>

      <div data-hf-id="hf-5ywo" id="outro" class="scene-host" data-composition-id="outro" data-composition-src="compositions/outro.html"
        data-start="11" data-duration="4" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#blob-a", { x: 0, y: 0 }, { x: 160, y: 90, duration: 15, ease: "none" }, 0);
      tl.fromTo("#blob-b", { x: 0, y: 0 }, { x: -140, y: -80, duration: 15, ease: "none" }, 0);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
