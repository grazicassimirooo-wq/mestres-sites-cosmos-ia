name: Nova ferramenta de IA/Dev
description: Cadastra uma nova ferramenta no catálogo — a descrição, categoria e preço são gerados automaticamente por IA.
title: "[Nova ferramenta] "
labels: ["nova-ferramenta"]
body:
  - type: input
    id: nome
    attributes:
      label: Nome da ferramenta
      placeholder: "Ex.: Claude"
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Link
      placeholder: "https://..."
    validations:
      required: true
