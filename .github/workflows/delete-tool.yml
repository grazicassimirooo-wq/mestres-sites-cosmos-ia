name: Excluir ferramenta via Issue

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  delete-tool:
    if: contains(github.event.issue.labels.*.name, 'excluir-ferramenta')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Remover ferramenta do catálogo
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node scripts/delete-tool-entry.mjs

      - name: Commitar catálogo atualizado
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tools.json
          if git diff --cached --quiet; then
            echo "Nada para commitar"
          else
            git commit -m "Remove ferramenta via issue #${{ github.event.issue.number }}"
            git push
          fi

      - name: Publicar site atualizado (gh-pages)
        if: success()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          exclude_assets: ".github,scripts"

      - name: Comentar e fechar issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let result;
            try {
              result = JSON.parse(fs.readFileSync('/tmp/tool-result.json', 'utf-8'));
            } catch {
              result = { success: false, message: 'Não foi possível ler o resultado do processamento.' };
            }

            const lines = result.success
              ? [
                  '🗑️ Ferramenta removida do catálogo!',
                  '',
                  `**${result.name}**`,
                  `- Link: ${result.link}`,
                ]
              : [`⚠️ Não foi possível excluir automaticamente: ${result.message}`];

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: lines.join('\n'),
            });

            if (result.success || result.notFound) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed',
              });
            }
